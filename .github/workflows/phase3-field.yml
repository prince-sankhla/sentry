name: Phase 3 Field Mission Tests

on:
  push:
    branches:
      - main
      - phase-3-rover-telemetry-camera
  pull_request:
    branches:
      - main

jobs:
  phase3-field:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend:.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies and pytest
        run: pip install -r backend/requirements.txt pytest
      - name: Run Phase 3 gateway contracts
        run: pytest -q sentry_field/tests/test_phase3_mission.py
