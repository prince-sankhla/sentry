name: Phase 2 Backend Tests

on:
  push:
    branches:
      - main
      - phase-2-physical-verification-handoff
  pull_request:
    branches:
      - main

jobs:
  phase2-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run Phase 2 contract tests
        run: python -m unittest discover -s tests -p 'test_phase2_field_verification.py' -v
