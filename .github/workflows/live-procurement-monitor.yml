name: Live procurement monitor

on:
  schedule:
    # CPPP/ePublishing and GeM publish updates are surfaced on roughly a
    # 15-minute cadence, so poll at the same resolution.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: live-procurement-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install monitor dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Poll official procurement sources and persist only flagged records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing GitHub Actions secret: DATABASE_URL"; exit 1; }
          python backend/scripts/live_monitor_cycle.py
