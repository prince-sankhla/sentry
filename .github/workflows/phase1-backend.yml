name: Phase 1 Backend Tests

on:
  push:
    branches:
      - main
      - phase-1-recommended-investigation
  pull_request:
    branches:
      - main

jobs:
  phase1-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 1 contract tests
        run: python -m unittest discover -s tests -p 'test_phase1_field_leads.py' -v
